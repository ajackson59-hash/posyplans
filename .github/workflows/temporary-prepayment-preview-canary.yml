name: Temporary Prepayment Preview Provider Canary

on:
  push:
    branches:
      - fix/prepayment-preview-quality-lock
    paths:
      - .github/workflows/temporary-prepayment-preview-canary.yml

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Immutable Preview deployment containing the fixed-corpus runner. A
      # later branch deployment cannot make this canary accidentally exercise
      # different code while the request is in flight.
      BASE_URL: https://posy-czlto7pka-poseplans.vercel.app
      EXPECTED_SHA: 984d53a40bb68d5d14bc6b0c83da2474bc58214f
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Verify protected Preview access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p canary-artifacts
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not configured."
            exit 1
          fi

          status="$(curl \
            --silent \
            --show-error \
            --location \
            --output canary-artifacts/deployment-report.json \
            --write-out '%{http_code}' \
            --header 'Accept: application/json' \
            --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            --header 'x-vercel-set-bypass-cookie: true' \
            "${BASE_URL}/api/qa/prepayment-preview-benchmark/report")"

          echo "HTTP $status"
          test "$status" = "200"
          jq -e --arg sha "$EXPECTED_SHA" '.gitSha == $sha and .expectedRuns == 72' \
            canary-artifacts/deployment-report.json >/dev/null

      - name: Run one private provider canary
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          status="$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 295 \
            --request POST \
            --output canary-artifacts/canary.json \
            --write-out '%{http_code}' \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            --header 'x-vercel-set-bypass-cookie: true' \
            --data '{}' \
            "${BASE_URL}/api/qa/prepayment-preview-benchmark/rooftop-fortieth/1")"
          curl_exit=$?
          set -e

          if [ "$curl_exit" -ne 0 ] || [ "$status" = "202" ]; then
            echo "The original request is still running; polling its durable summary."
            for attempt in $(seq 1 32); do
              poll_status="$(curl \
                --silent \
                --show-error \
                --location \
                --output canary-artifacts/canary.json \
                --write-out '%{http_code}' \
                --header 'Accept: application/json' \
                --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
                --header 'x-vercel-set-bypass-cookie: true' \
                "${BASE_URL}/api/qa/prepayment-preview-benchmark/rooftop-fortieth/1" || true)"
              if [ "$poll_status" = "200" ] && jq -e '.state == "complete"' canary-artifacts/canary.json >/dev/null 2>&1; then
                status=200
                break
              fi
              sleep 15
            done
          fi

          echo "HTTP $status"
          jq . canary-artifacts/canary.json
          test "$status" = "200"
          jq -e '.state == "complete"' canary-artifacts/canary.json >/dev/null

      - name: Download every private canary candidate
        if: always() && steps.generate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          attempts="$(jq -r '.attempts // 0' canary-artifacts/canary.json)"
          if [ "$attempts" -gt 0 ]; then
            for candidate in $(seq 1 "$attempts"); do
              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
                --header 'x-vercel-set-bypass-cookie: true' \
                "${BASE_URL}/api/qa/prepayment-preview-benchmark/rooftop-fortieth/1/asset/${candidate}" \
                --output "canary-artifacts/candidate-${candidate}.png"
            done
          fi

      - name: Upload private canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepayment-preview-canary
          path: canary-artifacts
          retention-days: 1
          if-no-files-found: error

      - name: Enforce the canary gate
        if: always() && steps.generate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .approved == true
            and .kind == "approved-image"
            and .model == "gpt-image-2"
            and (.approvedCandidate | type == "number")
            and (.reviews[(.approvedCandidate - 1)].tier1Passed == true)
            and (.reviews[(.approvedCandidate - 1)].visionPassed == true)
          ' canary-artifacts/canary.json >/dev/null
