name: Apply Text First Named Canary

on:
  push:
    branches:
      - codex/launch-blockers
    paths:
      - .github/workflows/apply-text-first-named-canary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
      VERCEL_ENV: local
      VERCEL_GIT_COMMIT_REF: ci-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/launch-blockers

      - name: Apply text-first canary patch
        run: python script/patch_text_first_named_canary.py

      - name: Verify patch
        run: |
          set -euo pipefail
          git diff --check
          npm ci
          npm run check
          npm test
          npm run vercel-build

      - name: Commit verified patch and retire patch runner
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-text-first-named-canary.yml script/patch_text_first_named_canary.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/prePaymentPreviewQuality.ts server/emailDiagnosticRoutes.ts tests/prePaymentPreviewReferenceQuality.test.ts
          git diff --cached --check
          git commit -m 'Canary named first look without image-edit compositing'
          git push origin HEAD:codex/launch-blockers
