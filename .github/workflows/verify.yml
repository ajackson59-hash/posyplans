name: Verify Posy

on:
  pull_request:
  push:
    branches:
      - fix/launch-qa-find-my-event-label

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check application
        run: npm run check

      - name: Run regression suite
        run: npm test

      - name: Build production bundles
        run: npm run vercel-build

      # A successful build is not proof that Find My Event can deliver mail.
      # On launch-branch pushes, verify the stable Preview alias when GitHub has
      # Vercel's protection-bypass secret. Without that secret the endpoint is
      # intentionally unreachable from an anonymous runner, so CI records a
      # warning instead of falsely treating Preview protection as an app defect.
      # The exact protected deployment must still be checked through authenticated
      # Vercel access before merge.
      - name: Verify deployed Preview email sender
        if: github.event_name == 'push'
        env:
          EMAIL_CONFIG_URL: https://posy-git-fix-launch-qa-find-my-event-label-poseplans.vercel.app/api/email/config
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "::warning::Skipping protected Preview email-health curl because VERCEL_AUTOMATION_BYPASS_SECRET is not configured. Verify the exact deployment through authenticated Vercel access before merge."
            exit 0
          fi

          rm -f /tmp/posy-email-config.json /tmp/posy-email-headers.txt
          curl_args=(
            --silent
            --show-error
            --location
            --output /tmp/posy-email-config.json
            --dump-header /tmp/posy-email-headers.txt
            --write-out '%{http_code}'
            --header 'Accept: application/json'
            --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}"
          )

          for attempt in $(seq 1 40); do
            status="$(curl "${curl_args[@]}" "$EMAIL_CONFIG_URL" || true)"
            content_type="$(grep -i '^content-type:' /tmp/posy-email-headers.txt | tail -1 | tr -d '\r' || true)"

            if [ "$status" = "200" ] && grep -qi 'application/json' <<<"$content_type"; then
              break
            fi

            if [ "$attempt" = "40" ]; then
              echo "Preview email-health endpoint did not become ready (last HTTP status: $status; $content_type)."
              exit 1
            fi
            sleep 5
          done

          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('/tmp/posy-email-config.json', 'utf8'));
          console.log(JSON.stringify({
            environment: result.environment,
            apiKeyConfigured: result.apiKeyConfigured,
            fromAddressConfigured: result.fromAddressConfigured,
            productionSenderConfigured: result.productionSenderConfigured,
            usesTestSender: result.usesTestSender,
            senderDomain: result.senderDomain,
          }));

          if (!result.productionSenderConfigured) {
            console.error('Find My Event email is not launch-ready in Preview. Configure RESEND_API_KEY and a verified RESEND_FROM_EMAIL for the Preview environment.');
            process.exit(1);
          }
          NODE
