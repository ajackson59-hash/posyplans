name: Apply Compact Teaser Premium Contract

on:
  push:
    branches:
      - codex/launch-blockers
    paths:
      - .github/workflows/apply-compact-teaser-premium.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
      VERCEL_ENV: local
      VERCEL_GIT_COMMIT_REF: ci-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/launch-blockers

      # Retry after targeting only the teaser concept prompt field.
      - name: Fit premium teaser direction inside the schema budget
        run: python script/patch_teaser_premium_finish.py

      - name: Verify exact product contract
        run: |
          set -euo pipefail
          git diff --check
          npm ci
          npm run check
          npm test
          npm run vercel-build

      - name: Commit verified product repair and retire temporary runner
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-compact-teaser-premium.yml script/patch_teaser_premium_finish.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/prePaymentPreviewQuality.ts tests/prePaymentPreviewQuality.test.ts
          git diff --cached --check
          git commit -m 'Fit premium first-look direction inside prompt budget'
          git push origin HEAD:codex/launch-blockers
