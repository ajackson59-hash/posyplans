name: Enable One-Time Preview Build Canary

on:
  push:
    branches:
      - codex/launch-blockers
    paths:
      - .github/workflows/enable-preview-build-canary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/launch-blockers

      - name: Wire the one-time canary into Preview builds only
        run: |
          python - <<'PY'
          from pathlib import Path
          route = Path('server/emailDiagnosticRoutes.ts')
          text = route.read_text()
          old = 'async function runInternalPreviewCanary() {'
          new = 'export async function runInternalPreviewCanary() {'
          if text.count(old) != 1:
              raise SystemExit(f'expected one canary function declaration, found {text.count(old)}')
          route.write_text(text.replace(old, new, 1))

          package = Path('package.json')
          text = package.read_text()
          old = '"vercel-build": "vite build && rm -rf public && cp -r dist/public public && npm run build:vercel-fn",'
          new = '"vercel-build": "vite build && rm -rf public && cp -r dist/public public && npm run build:vercel-fn && tsx script/run_preview_build_canary.ts",'
          if text.count(old) != 1:
              raise SystemExit(f'expected one vercel-build script, found {text.count(old)}')
          package.write_text(text.replace(old, new, 1))
          PY

      - name: Verify canary wiring without provider spend in CI
        run: |
          npm ci
          npm run check
          npm test
          npm run vercel-build

      - name: Commit wiring and retire workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/enable-preview-build-canary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json server/emailDiagnosticRoutes.ts
          git commit -m 'Run one internal preview canary during Vercel build'
          git push origin HEAD:codex/launch-blockers
