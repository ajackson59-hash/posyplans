name: Restrict Funded Preview Benchmark to Original Themes

on:
  push:
    branches:
      - fix/prepayment-preview-quality-lock
    paths:
      - .github/workflows/restrict-generated-preview-benchmark.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prepayment-preview-quality-lock

      - name: Narrow provider spend to generic and original themes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shared = Path('shared/prePaymentPreviewBenchmark.ts')
          text = shared.read_text()
          marker = 'export function getPrePaymentPreviewBenchmarkCase(id: string): PrePaymentPreviewBenchmarkCase | undefined {'
          addition = '''export const PREPAYMENT_PREVIEW_GENERATED_BENCHMARK: readonly PrePaymentPreviewBenchmarkCase[] =
            PREPAYMENT_PREVIEW_BENCHMARK.filter((testCase) => !testCase.expectedNamedReference);

          export function getPrePaymentPreviewGeneratedBenchmarkCase(
            id: string,
          ): PrePaymentPreviewBenchmarkCase | undefined {
            return PREPAYMENT_PREVIEW_GENERATED_BENCHMARK.find((testCase) => testCase.id === id);
          }

          '''
          if 'PREPAYMENT_PREVIEW_GENERATED_BENCHMARK' not in text:
              if marker not in text:
                  raise SystemExit('shared benchmark insertion point not found')
              text = text.replace(marker, addition + marker, 1)
              shared.write_text(text)

          route = Path('server/prePaymentPreviewBenchmarkRoutes.ts')
          text = route.read_text()
          text = text.replace(
              '  PREPAYMENT_PREVIEW_BENCHMARK,\n  getPrePaymentPreviewBenchmarkCase,',
              '  PREPAYMENT_PREVIEW_BENCHMARK,\n  PREPAYMENT_PREVIEW_GENERATED_BENCHMARK,\n  getPrePaymentPreviewGeneratedBenchmarkCase,',
              1,
          )
          text = text.replace(
              'const BENCHMARK_VERSION = "prepayment-quality-lock-2026-08-31-v3";',
              'const BENCHMARK_VERSION = "prepayment-quality-lock-2026-08-31-v4-generic";',
              1,
          )
          text = text.replace(
              'const index = PREPAYMENT_PREVIEW_BENCHMARK.findIndex((testCase) => testCase.id === caseId);',
              'const index = PREPAYMENT_PREVIEW_GENERATED_BENCHMARK.findIndex((testCase) => testCase.id === caseId);',
              1,
          )
          text = text.replace(
              'expectedRuns: PREPAYMENT_PREVIEW_BENCHMARK.length * 3,',
              'scope: "generic-and-original-themes-only",\n      excludedNamedThemeCases: PREPAYMENT_PREVIEW_BENCHMARK.length - PREPAYMENT_PREVIEW_GENERATED_BENCHMARK.length,\n      expectedRuns: PREPAYMENT_PREVIEW_GENERATED_BENCHMARK.length * 3,',
              1,
          )
          occurrences = text.count('getPrePaymentPreviewBenchmarkCase(')
          if occurrences != 3:
              raise SystemExit(f'expected 3 case-lookup occurrences, found {occurrences}')
          text = text.replace(
              'getPrePaymentPreviewBenchmarkCase(',
              'getPrePaymentPreviewGeneratedBenchmarkCase(',
          )
          route.write_text(text)

          test_path = Path('tests/prePaymentPreviewBenchmarkRoutes.test.ts')
          test = test_path.read_text()
          anchor = '''  it("runs one approved candidate, stores its private bytes and is idempotent", async () => {'''
          additions = '''  it("hard-blocks named entertainment themes from provider spend", async () => {
            const generate = vi.fn();
            const response = await request(makeApp({ generate }))
              .post("/api/qa/prepayment-preview-benchmark/unicorn-academy-igloo/1")
              .send({});

            expect(response.status).toBe(404);
            expect(generate).not.toHaveBeenCalled();
          });

          it("reports a clean 48-run generic-only release scope", async () => {
            const memory = inMemoryStore();
            const response = await request(makeApp({ store: memory.store }))
              .get("/api/qa/prepayment-preview-benchmark/report");

            expect(response.status).toBe(200);
            expect(response.body).toEqual(expect.objectContaining({
              benchmarkVersion: "prepayment-quality-lock-2026-08-31-v4-generic",
              scope: "generic-and-original-themes-only",
              excludedNamedThemeCases: 8,
              expectedRuns: 48,
              completedRuns: 0,
            }));
          });

          '''
          if 'hard-blocks named entertainment themes from provider spend' not in test:
              if anchor not in test:
                  raise SystemExit('route test insertion point not found')
              test = test.replace(anchor, additions + anchor, 1)
              test_path.write_text(test)
          PY

      - name: Verify the narrowed release runner
        shell: bash
        run: |
          npm ci
          npm run check
          npx vitest run \
            tests/prePaymentPreviewBenchmark.test.ts \
            tests/prePaymentPreviewBenchmarkRoutes.test.ts \
            tests/prePaymentPreviewQualityRoutes.test.ts \
            tests/prePaymentReferenceBoard.test.ts

      - name: Commit and retire this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/restrict-generated-preview-benchmark.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shared/prePaymentPreviewBenchmark.ts server/prePaymentPreviewBenchmarkRoutes.ts tests/prePaymentPreviewBenchmarkRoutes.test.ts
          git commit -m 'Benchmark generated previews only for original themes'
          git push origin HEAD:fix/prepayment-preview-quality-lock
