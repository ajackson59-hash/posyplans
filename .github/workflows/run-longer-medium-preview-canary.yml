name: Measure Longer Medium Preview Canary

on:
  push:
    branches:
      - codex/launch-blockers
    paths:
      - .github/workflows/run-longer-medium-preview-canary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/launch-blockers

      - name: Set the temporary canary to one medium candidate with a longer background window
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/emailDiagnosticRoutes.ts')
          text = path.read_text()
          for old, new in [
            ('quality: "low",', 'quality: "medium",'),
            ('const INTERNAL_CANARY_DEADLINE_MS = 52_000;', 'const INTERNAL_CANARY_DEADLINE_MS = 115_000;'),
          ]:
            if text.count(old) != 1:
              raise SystemExit(f'expected one match: {old!r}; found {text.count(old)}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify temporary canary build
        run: |
          npm ci
          npm run check
          npm test
          npm run vercel-build

      - name: Commit and retire workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/run-longer-medium-preview-canary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/emailDiagnosticRoutes.ts
          git commit -m 'Measure one medium preview with a longer background window'
          git push origin HEAD:codex/launch-blockers
