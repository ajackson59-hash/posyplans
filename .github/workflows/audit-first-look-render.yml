name: Audit First-Look Rendering

on:
  push:
    branches:
      - codex/launch-blockers
    paths:
      - .github/workflows/audit-first-look-render.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/launch-blockers

      - name: Install application and browser driver
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0

      - name: Build and start the client
        run: |
          npm run vercel-build
          nohup npx vite preview --host 127.0.0.1 --port 4173 >/tmp/posy-vite-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/posy-vite-preview.log
          exit 1

      - name: Capture and assert mobile and desktop states
        run: node script/first_look_render_audit.mjs

      - name: Upload rendered audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: first-look-render-audit
          path: artifacts/first-look-render-audit
          if-no-files-found: error
          retention-days: 7

      - name: Retire audit harness
        run: |
          set -euo pipefail
          git rm .github/workflows/audit-first-look-render.yml script/first_look_render_audit.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record successful internal first-look render audit'
          git push origin HEAD:codex/launch-blockers
