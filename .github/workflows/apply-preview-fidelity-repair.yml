              );
              expect(prompt).toContain("REQUIRED NAMED IDENTITIES: blippi, meekah");
              expect(prompt).toContain("Do not replace the subject with an abstract symbol, bow tie");
            });
          });
          '''
          concept_test = '\n'.join(line[10:] if line.startswith('          ') else line for line in concept_test.splitlines()) + '\n'
          (root / 'tests/prePaymentPreviewConcept.test.ts').write_text(concept_test)

