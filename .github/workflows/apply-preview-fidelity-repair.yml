name: Apply Preview Fidelity Repair

on:
  push:
    branches:
      - fix/launch-qa-find-my-event-label

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Trigger preview fidelity repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/launch-qa-find-my-event-label
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply the fidelity repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')

          concept_gate = r'''import type { InviteDesignConcept } from "@shared/inviteDesign";
          import { getStyleLane } from "@shared/inviteDesign";

          // ── Quality Gate: Concept Scoring ──────────────────────────────────────
          //
          // After generating 6 concepts (one per style lane), each is scored on:
          // 1. Distinctiveness — how different from the other surviving concepts
          // 2. Theme fit — does the concept preserve the host's actual subject
          // 3. Palette harmony — are the 4 colors visually balanced
          // 4. Composition clarity — is the layout/medium combination coherent
          //
          // Named show/franchise/character identity is a hard fidelity signal, not
          // a decorative suggestion. A tidy abstract concept must never outrank the
          // literal subject the host asked for.

          export interface ConceptScore {
            concept: InviteDesignConcept;
            index: number;
            distinctiveness: number;
            themeFit: number;
            paletteHarmony: number;
            compositionClarity: number;
            total: number;
          }

          const GENERIC_THEME_WORDS = new Set([
            "about", "after", "again", "birthday", "celebration", "event", "extravaganza",
            "featuring", "fourth", "from", "host", "invitation", "party", "preview", "themed",
            "theme", "there", "this", "with", "will", "your", "years", "year", "fun", "all",
            "inside", "indoor", "outdoor", "requested", "required", "named", "identities",
          ]);

          function normalizeToken(value: string): string {
            return value
              .toLowerCase()
              .replace(/[’']/g, "'")
              .replace(/'s$/, "")
              .replace(/[^a-z0-9-]/g, "");
          }

          function meaningfulTokens(value: string): string[] {
            const seen = new Set<string>();
            const tokens: string[] = [];
            for (const raw of value.split(/\s+/)) {
              const token = normalizeToken(raw);
              if (token.length < 3 || /\d/.test(token) || GENERIC_THEME_WORDS.has(token) || seen.has(token)) continue;
              seen.add(token);
              tokens.push(token);
            }
            return tokens;
          }

          function cleanSignalPhrase(value: string): string {
            return value
              .trim()
              .replace(/^[A-Z][A-Za-z-]+(?:['’]s)\s+/, "")
              .replace(/\b(?:party|birthday|celebration|extravaganza)\b.*$/i, "")
              .trim();
          }

          /**
           * Pulls out the identity words a concept must preserve. Explicit cues
           * such as "featuring Blippi and Meekah" win. When those are absent,
           * title-like phrases before "themed" or "party" cover briefs such as
           * "Unicorn Academy themed" and "Paw Patrol Party".
           */
          export function extractNamedThemeSignals(themePrompt: string): string[] {
            const explicit = new Set<string>();
            const add = (phrase: string, target: Set<string>) => {
              for (const token of meaningfulTokens(cleanSignalPhrase(phrase))) target.add(token);
            };

            const explicitPatterns = [
              /\b(?:featuring|starring|inspired by|based on|characters? from)\s+([^.!?;\n]+)/gi,
              /\bwith\s+the\s+characters?\s+([^.!?;\n]+)/gi,
            ];
            for (const pattern of explicitPatterns) {
              for (const match of themePrompt.matchAll(pattern)) add(match[1] ?? "", explicit);
            }
            if (explicit.size > 0) return [...explicit];

            const inferred = new Set<string>();
            const inferredPatterns = [
              /([A-Z0-9][A-Za-z0-9'’&-]*(?:\s+(?:[A-Z0-9][A-Za-z0-9'’&-]*|and|of|the)){0,5})\s+(?:theme|themed)\b/g,
              /([A-Z][A-Za-z0-9'’&-]*(?:\s+(?:[A-Z0-9][A-Za-z0-9'’&-]*|and|of|the)){1,5})\s+(?:party|birthday|celebration|extravaganza)\b/g,
            ];
            for (const pattern of inferredPatterns) {
              for (const match of themePrompt.matchAll(pattern)) add(match[1] ?? "", inferred);
            }
            return [...inferred];
          }

          export function conceptSearchText(concept: InviteDesignConcept): string {
            return [
              concept.conceptName,
              concept.description,
              concept.illustrationPrompt,
              concept.artDirection?.subjectFocus,
              concept.artDirection?.compositionType,
            ]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();
          }

          export function conceptContainsNamedSignals(
            concept: InviteDesignConcept,
            signals: string[],
          ): boolean {
            if (signals.length === 0) return true;
            const text = conceptSearchText(concept);
            return signals.every((signal) => text.includes(signal));
          }

          // Computes color distance in RGB space — smaller means more similar palettes.
          function paletteDistance(a: string[], b: string[]): number {
            let dist = 0;
            for (let i = 0; i < 4; i++) {
              const ca = parseInt(a[i].slice(1), 16);
              const cb = parseInt(b[i].slice(1), 16);
              const dr = ((ca >> 16) & 0xff) - ((cb >> 16) & 0xff);
              const dg = ((ca >> 8) & 0xff) - ((cb >> 8) & 0xff);
              const db = (ca & 0xff) - (cb & 0xff);
              dist += Math.sqrt(dr * dr + dg * dg + db * db);
            }
            return dist;
          }

          // Scores palette harmony — measures how balanced the palette is.
          function scorePaletteHarmony(colors: string[]): number {
            if (colors.length < 4) return 0.5;
            const lights = colors.map((c) => {
              const v = parseInt(c.slice(1), 16);
              return (((v >> 16) & 0xff) + ((v >> 8) & 0xff) + (v & 0xff)) / 3;
            });
            const range = Math.max(...lights) - Math.min(...lights);
            const rangeScore = Math.min(range / 150, 1);
            const unique = new Set(colors.map((c) => c.toLowerCase())).size;
            const uniquenessScore = unique / 4;
            return (rangeScore + uniquenessScore) / 2;
          }

          // Scores composition clarity — does the layout + medium combination make sense?
          function scoreCompositionClarity(concept: InviteDesignConcept): number {
            const lane = concept.styleLaneId ? getStyleLane(concept.styleLaneId) : null;
            if (!lane) return 0.6;

            const layoutMatch = lane.preferredLayouts.includes(concept.layoutStyle);
            const ad = concept.artDirection;
            const adCompleteness = ad
              ? [
                  ad.illustrationMedium,
                  ad.subjectFocus,
                  ad.compositionType,
                  ad.negativeSpace,
                  ad.colorTreatment,
                  ad.texture,
                  ad.avoidList,
                ].filter((f) => f && f.length > 0).length / 7
              : 0.5;

            return (layoutMatch ? 0.6 : 0.3) + adCompleteness * 0.4;
          }

          function scoreThemeFit(concept: InviteDesignConcept, themePrompt: string): number {
            const themeWords = meaningfulTokens(themePrompt);
            if (themeWords.length === 0) return 0.7;

            const conceptText = conceptSearchText(concept);
            const generalMatches = themeWords.filter((word) => conceptText.includes(word)).length;
            const generalCoverage = generalMatches / themeWords.length;
            const namedSignals = extractNamedThemeSignals(themePrompt);

            if (namedSignals.length > 0) {
              const namedMatches = namedSignals.filter((signal) => conceptText.includes(signal)).length;
              const namedCoverage = namedMatches / namedSignals.length;
              if (namedCoverage === 0) return 0.02;
              // Exact named identity dominates all softer styling similarities.
              return Math.min(namedCoverage * 0.78 + generalCoverage * 0.22, 1);
            }

            return Math.min(generalCoverage + 0.3, 1);
          }

          // Scores distinctiveness — how different this concept is from the others.
          function scoreDistinctiveness(concept: InviteDesignConcept, others: InviteDesignConcept[]): number {
            if (others.length === 0) return 1;

            let paletteScore = 0;
            let layoutScore = 0;
            let laneScore = 0;

            for (const other of others) {
              paletteScore += Math.min(paletteDistance(concept.paletteColors, other.paletteColors) / 400, 1);
              layoutScore += concept.layoutStyle !== other.layoutStyle ? 1 : 0;
              laneScore += concept.styleLaneId !== other.styleLaneId ? 1 : 0;
            }

            const n = others.length;
            return (paletteScore / n + layoutScore / n + laneScore / n) / 3;
          }

          export function scoreConcepts(
            concepts: InviteDesignConcept[],
            themePrompt: string,
          ): ConceptScore[] {
            const namedTheme = extractNamedThemeSignals(themePrompt).length > 0;
            return concepts.map((concept, index) => {
              const others = concepts.filter((_, i) => i !== index);
              const distinctiveness = scoreDistinctiveness(concept, others);
              const themeFit = scoreThemeFit(concept, themePrompt);
              const paletteHarmony = scorePaletteHarmony(concept.paletteColors);
              const compositionClarity = scoreCompositionClarity(concept);
              const total = namedTheme
                ? distinctiveness * 0.10 + themeFit * 0.65 + paletteHarmony * 0.10 + compositionClarity * 0.15
                : distinctiveness * 0.25 + themeFit * 0.30 + paletteHarmony * 0.20 + compositionClarity * 0.25;
              return { concept, index, distinctiveness, themeFit, paletteHarmony, compositionClarity, total };
            }).sort((a, b) => b.total - a.total);
          }

          export function selectTopConcepts(
            concepts: InviteDesignConcept[],
            themePrompt: string,
            count: number = 4,
          ): InviteDesignConcept[] {
            if (concepts.length <= count) return concepts;

            const scored = scoreConcepts(concepts, themePrompt);
            const namedSignals = extractNamedThemeSignals(themePrompt);
            const namedCompliant = namedSignals.length > 0
              ? scored.filter(({ concept }) => conceptContainsNamedSignals(concept, namedSignals))
              : scored;
            // Prefer direct concepts first; keep the full scored pool only as a
            // downstream fallback so the preview route can explicitly reject it.
            const pool = namedCompliant.length > 0
              ? [...namedCompliant, ...scored.filter((entry) => !namedCompliant.includes(entry))]
              : scored;

            const selected: InviteDesignConcept[] = [];
            const usedLanes = new Set<string>();

            for (const { concept } of pool) {
              const laneId = concept.styleLaneId ?? `unknown-${selected.length}`;
              if (usedLanes.has(laneId)) continue;
              usedLanes.add(laneId);
              selected.push(concept);
              if (selected.length >= count) break;
            }

            if (selected.length < count) {
              for (const { concept } of pool) {
                if (!selected.includes(concept)) {
                  selected.push(concept);
                  if (selected.length >= count) break;
                }
              }
            }

            return selected;
          }
          '''
          # Remove indentation introduced by the YAML block.
          concept_gate = '\n'.join(line[10:] if line.startswith('          ') else line for line in concept_gate.splitlines()) + '\n'
          (root / 'server/conceptQualityGate.ts').write_text(concept_gate)

          preview_concept = r'''import type { Event } from "@shared/schema";
          import type { InviteDesignConcept } from "@shared/inviteDesign";
          import { eventStyleSummary } from "@shared/eventStyle";
          import {
            conceptContainsNamedSignals,
            extractNamedThemeSignals,
            scoreConcepts,
          } from "./conceptQualityGate";

          type PreviewEvent = Pick<
            Event,
            "eventName" | "eventType" | "themeName" | "vibeDescription"
          >;

          /**
           * Correct a highly likely character-name typo without altering the host's
           * saved words. The normalized brief is used only for creative generation.
           */
          export function normalizePrePaymentPreviewBrief(value: string): string {
            if (/\bblippi\b/i.test(value) && /\bmika\b/i.test(value) && !/\bmeekah\b/i.test(value)) {
              return value.replace(/\bmika\b/gi, "Meekah");
            }
            return value;
          }

          export function prePaymentPreviewSourceBrief(event: PreviewEvent): string {
            const style = eventStyleSummary(event);
            const name = event.eventName?.trim() ?? "";
            const combined = style && name && !style.toLowerCase().includes(name.toLowerCase())
              ? `${style}\nEvent title: ${name}`
              : style || name || event.eventType || "Celebration";
            return normalizePrePaymentPreviewBrief(combined);
          }

          /**
           * The pre-payment image is a conversion proof, not an exploratory mood
           * board. It must communicate the literal subject immediately.
           */
          export function buildPrePaymentPreviewPrompt(sourceBrief: string): string {
            const signals = extractNamedThemeSignals(sourceBrief);
            return [
              sourceBrief,
              "PRE-PAYMENT PREVIEW REQUIREMENT: Create a literal, immediately recognizable scene from the host's brief. The requested subject must be the dominant focal point.",
              signals.length > 0
                ? `REQUIRED NAMED IDENTITIES: ${signals.join(", ")}. Keep these exact identities in both subjectFocus and illustrationPrompt, and depict every one of them visibly.`
                : "Preserve the concrete people, creatures, vehicles, objects, setting, and activities the host named.",
              "Do not replace the subject with an abstract symbol, bow tie, color blocks, dots, confetti, palette-only styling, or generic adjacent aesthetic. Those may appear only as minor accents around the actual scene.",
              "The image must feel like premium children's invitation artwork with a clear focal scene, expressive characters where requested, and enough environmental detail that a parent instantly knows Posy understood the party.",
              "Do not render a franchise logo, title treatment, watermark, invitation wording, letters, or numbers.",
            ].join("\n");
          }

          export function selectPrePaymentPreviewConcept(
            concepts: InviteDesignConcept[],
            sourceBrief: string,
          ): InviteDesignConcept {
            if (concepts.length === 0) throw new Error("No design concept returned");
            const scored = scoreConcepts(concepts, sourceBrief);
            const signals = extractNamedThemeSignals(sourceBrief);

            if (signals.length > 0) {
              const direct = scored.find(({ concept }) => conceptContainsNamedSignals(concept, signals));
              if (!direct) {
                throw new Error(`Preview concepts erased the named theme identity: ${signals.join(", ")}`);
              }
              return direct.concept;
            }

            return scored[0].concept;
          }
          '''
          preview_concept = '\n'.join(line[10:] if line.startswith('          ') else line for line in preview_concept.splitlines()) + '\n'
          (root / 'server/prePaymentPreviewConcept.ts').write_text(preview_concept)

          prepayment = (root / 'server/prePaymentPreview.ts').read_text()
          old_resolution = '''// 160px made the teaser too soft to judge. 300px preserves enough theme and
          // subject detail to create confidence while still forcing a meaningful
          // downsample from the smallest current generated/source fixture and keeping
          // the production-quality asset behind checkout.
          export const PRE_PAYMENT_PREVIEW_LONG_EDGE = 300;'''
          new_resolution = '''// 300px still looked visibly degraded inside the sales card. 560px is crisp on
          // high-density mobile screens while remaining materially below the 1024px+
          // paid source asset. The owner-token gate and branded overlay—not deliberate
          // ugliness—protect the full invitation value.
          export const PRE_PAYMENT_PREVIEW_LONG_EDGE = 560;'''
          assert old_resolution in prepayment, 'prePaymentPreview resolution block not found'
          (root / 'server/prePaymentPreview.ts').write_text(prepayment.replace(old_resolution, new_resolution))

          illustration = (root / 'server/illustrationGen.ts').read_text()
          critic_old = '''4. theme_fit: Does the illustration match the described concept? Score 1 for irrelevant, 5 for perfect match. If the concept names a recognizable fictional world, show, film, game, character universe, or other specific cultural reference, a generic category resemblance is NOT enough. A generic unicorn image for a specifically named unicorn world, or generic pop-star imagery for a specifically named pop-culture theme, must score 3 or lower unless the image carries distinctive visual cues from the requested reference.

          Respond as STRICT JSON only:'''
          critic_new = '''4. theme_fit: Does the illustration match the ORIGINAL HOST BRIEF as well as the described concept? Score 1 for irrelevant, 5 for perfect match. The original host brief is authoritative: if the concept itself drifted away from it, grade against the host brief, not the weaker concept. If the brief names a recognizable fictional world, show, film, game, character universe, or specific cultural reference, generic category resemblance is NOT enough. Missing any defining requested character or replacing the requested scene with abstract symbols must score 2 or lower.

          Respond as STRICT JSON only:'''
          assert critic_old in illustration, 'critic theme criterion not found'
          illustration = illustration.replace(critic_old, critic_new)

          eval_old = '''async function evaluateIllustrationQuality(
            imageDataUrl: string,
            concept: InviteDesignConcept,
          ): Promise<ArtQualityScore> {
            const client = new Anthropic();
            const laneLabel = concept.styleLaneId ?? "unknown";
            const prompt = `Evaluate this invitation illustration for a "${concept.conceptName}" concept in the "${laneLabel}" style lane. The illustration should depict: ${concept.illustrationPrompt}`;'''
          eval_new = '''async function evaluateIllustrationQuality(
            imageDataUrl: string,
            concept: InviteDesignConcept,
            sourceBrief?: string,
          ): Promise<ArtQualityScore> {
            const client = new Anthropic();
            const laneLabel = concept.styleLaneId ?? "unknown";
            const briefLine = sourceBrief
              ? ` Original host brief (authoritative): ${sourceBrief}`
              : "";
            const prompt = `Evaluate this invitation illustration for a "${concept.conceptName}" concept in the "${laneLabel}" style lane. The illustration should depict: ${concept.illustrationPrompt}.${briefLine}`;'''
          assert eval_old in illustration, 'evaluate signature not found'
          illustration = illustration.replace(eval_old, eval_new)

          tighten_old = '''function tightenIllustrationPrompt(originalPrompt: string, score: ArtQualityScore): string {
            const fixes: string[] = [];'''
          tighten_new = '''function tightenIllustrationPrompt(
            originalPrompt: string,
            score: ArtQualityScore,
            sourceBrief?: string,
          ): string {
            const fixes: string[] = [];'''
          assert tighten_old in illustration, 'tighten signature not found'
          illustration = illustration.replace(tighten_old, tighten_new)

          fidelity_old = '''  if (score.theme_fit <= THEME_FIDELITY_FAILURE_THRESHOLD) {
              fixes.push("closely match the specifically requested concept rather than a generic category; carry the distinctive visual cues, world-building, palette, atmosphere, motifs, and character/world signals described by the concept so a fan would immediately understand the intended reference");
            }'''
          fidelity_new = '''  if (score.theme_fit <= THEME_FIDELITY_FAILURE_THRESHOLD) {
              fixes.push("closely match the specifically requested concept rather than a generic category; carry the distinctive visual cues, world-building, palette, atmosphere, motifs, and character/world signals described by the concept so a fan would immediately understand the intended reference");
              if (sourceBrief) {
                fixes.push(`the original host brief is authoritative: ${sourceBrief}`);
                fixes.push("show the actual requested people, characters, setting, and activities as the main scene; do not substitute an abstract icon, bow tie, dots, color blocking, confetti, or palette-only shorthand");
              }
            }'''
          assert fidelity_old in illustration, 'theme tightening block not found'
          illustration = illustration.replace(fidelity_old, fidelity_new)

          generate_start = illustration.index('export async function generateInviteIllustrationWithQualityGate(')
          old_generate = illustration[generate_start:]
          new_generate = r'''export interface IllustrationQualityOptions {
            /** Original intake/event wording; authoritative when a generated concept drifts. */
            sourceBrief?: string;
            /** Preview uses medium for speed; paid invitation generation keeps high by default. */
            generationQuality?: "high" | "medium" | "low";
            /** Reject the asset instead of showing an unchecked or still-off-brief result. */
            requireFinalApproval?: boolean;
          }

          function qualityFailed(score: ArtQualityScore): boolean {
            return score.text_free <= TEXT_FAILURE_THRESHOLD
              || score.overall < QUALITY_THRESHOLD
              || score.theme_fit <= THEME_FIDELITY_FAILURE_THRESHOLD;
          }

          export async function generateInviteIllustrationWithQualityGate(
            concept: InviteDesignConcept,
            aspectRatio: "16:9" | "1:1" | "9:16",
            options: IllustrationQualityOptions = {},
          ): Promise<string> {
            const generationQuality = options.generationQuality ?? "high";
            let illustrationUrl = await generateInviteIllustration(concept, aspectRatio, generationQuality);

            try {
              let score = await evaluateIllustrationQuality(
                illustrationUrl,
                concept,
                options.sourceBrief,
              );

              if (qualityFailed(score)) {
                console.log(`[quality-gate] Illustration scored ${score.overall.toFixed(1)} / theme ${score.theme_fit} (${score.issues}). Regenerating with tightened prompt...`);
                const tightenedConcept: InviteDesignConcept = {
                  ...concept,
                  illustrationPrompt: tightenIllustrationPrompt(
                    concept.illustrationPrompt,
                    score,
                    options.sourceBrief,
                  ),
                };
                illustrationUrl = await generateInviteIllustration(
                  tightenedConcept,
                  aspectRatio,
                  generationQuality,
                );

                if (options.requireFinalApproval) {
                  score = await evaluateIllustrationQuality(
                    illustrationUrl,
                    tightenedConcept,
                    options.sourceBrief,
                  );
                  if (qualityFailed(score)) {
                    console.error(`[quality-gate] Final artwork rejected: overall ${score.overall.toFixed(1)}, theme ${score.theme_fit} (${score.issues})`);
                    throw new Error("Generated artwork did not faithfully match the host brief");
                  }
                }
              }
            } catch (err) {
              if (options.requireFinalApproval) throw err;
              // Paid/legacy callers preserve the previous graceful-degradation
              // behavior when the optional critic is unavailable.
              console.error("[quality-gate] Evaluation failed, using first generation:", err);
            }

            return illustrationUrl;
          }
          '''
          new_generate = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_generate.splitlines()) + '\n'
          illustration = illustration[:generate_start] + new_generate
          (root / 'server/illustrationGen.ts').write_text(illustration)

          routes = (root / 'server/routes.ts').read_text()
          import_anchor = '''import {
            canAttemptPrePaymentPreview,
            MAX_PRE_PAYMENT_PREVIEW_ATTEMPTS,
            PRE_PAYMENT_PREVIEW_FIDELITY_CUTOFF_MS,
            PRE_PAYMENT_PREVIEW_LONG_EDGE,
          } from "./prePaymentPreview";'''
          import_replacement = import_anchor + '''
          import {
            buildPrePaymentPreviewPrompt,
            prePaymentPreviewSourceBrief,
            selectPrePaymentPreviewConcept,
          } from "./prePaymentPreviewConcept";'''
          assert import_anchor in routes, 'routes preview import not found'
          routes = routes.replace(import_anchor, import_replacement, 1)

          route_old = '''      const concepts = await generateInviteDesignConcepts({
                // New intake events have no generated themeName before payment. The
                // host's own vibeDescription is therefore the source of truth for the
                // conversion preview, with event type/name only as a true fallback.
                themePrompt: eventStyleSummary(event),
                eventName: event.eventName,
                eventType: event.eventType,
                eventDate: event.eventDate,
                location: event.location,
                hostNames: event.hostNames,
                themeName: event.themeName,
              });
              const concept = concepts[0];
              if (!concept) throw new Error("No design concept returned");

              const aspectRatio = concept.layoutStyle === "banner" ? "16:9" : concept.layoutStyle === "full-bleed" ? "9:16" : "1:1";
              const illustrationUrl = await generateInviteIllustrationWithQualityGate(concept, aspectRatio);'''
          route_new = '''      const sourceBrief = prePaymentPreviewSourceBrief(event);
              const concepts = await generateInviteDesignConcepts({
                // The sales preview must prove Posy understood the literal event—not
                // merely echo a color palette or adjacent mood.
                themePrompt: buildPrePaymentPreviewPrompt(sourceBrief),
                eventName: event.eventName,
                eventType: event.eventType,
                eventDate: event.eventDate,
                location: event.location,
                hostNames: event.hostNames,
                themeName: event.themeName,
              });
              const concept = selectPrePaymentPreviewConcept(concepts, sourceBrief);

              const aspectRatio = concept.layoutStyle === "banner" ? "16:9" : concept.layoutStyle === "full-bleed" ? "9:16" : "1:1";
              const illustrationUrl = await generateInviteIllustrationWithQualityGate(
                concept,
                aspectRatio,
                {
                  sourceBrief,
                  generationQuality: "medium",
                  requireFinalApproval: true,
                },
              );'''
          assert route_old in routes, 'prepayment route generation block not found'
          routes = routes.replace(route_old, route_new, 1)
          (root / 'server/routes.ts').write_text(routes)

          route_test = (root / 'tests/prePaymentPreviewRoute.test.ts').read_text()
          route_test = route_test.replace('''  const size = 320;''', '''  const size = 640;''', 1)
          old_mock = '''const generateInviteDesignConcepts = vi.fn(async () => [
            { conceptName: "Test Concept", layoutStyle: "centered" },
          ]);'''
          new_mock = '''const generateInviteDesignConcepts = vi.fn(async () => [
            {
              conceptName: "Sunset Supper",
              description: "A candlelit rooftop dinner scene in terracotta and gold.",
              paletteColors: ["#A85D3A", "#D5A646", "#F5EBDD", "#392D2A"],
              fontPairingId: "editorial-serif",
              borderStyle: "thin-frame",
              layoutStyle: "centered",
              styleLaneId: "editorial-premium",
              artDirection: {
                illustrationMedium: "watercolor",
                subjectFocus: "a candlelit rooftop dinner table at sunset",
                compositionType: "centered focal scene",
                negativeSpace: "generous space around the table",
                colorTreatment: "terracotta and brushed gold",
                texture: "fine watercolor paper",
                avoidList: "no text, no letters, no numbers",
              },
              illustrationPrompt: "Elegant watercolor illustration of a candlelit rooftop dinner table at sunset in terracotta and gold. No text, no letters, no words, no numbers.",
            },
          ]);'''
          assert old_mock in route_test, 'preview route concept mock not found'
          route_test = route_test.replace(old_mock, new_mock)
          route_test = route_test.replace('''        themePrompt: "Candlelit rooftop dinner in terracotta and gold at sunset",''', '''        themePrompt: expect.stringContaining("Candlelit rooftop dinner in terracotta and gold at sunset"),''')
          call_anchor = '''    expect(generateInviteIllustrationWithQualityGate).toHaveBeenCalledTimes(1);
