          (root / 'tests/prePaymentPreviewRoute.test.ts').write_text(route_test)

          concept_test = r'''import { describe, expect, it } from "vitest";
          import type { InviteDesignConcept } from "@shared/inviteDesign";
          import {
            buildPrePaymentPreviewPrompt,
