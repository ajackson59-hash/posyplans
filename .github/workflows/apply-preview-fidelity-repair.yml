                "Polished character illustration of recognizable Blippi and Meekah in an indoor soft-play birthday scene with floating bubbles and ice-cream treats. No text, no letters, no words, no numbers.",
              );

              expect(selectPrePaymentPreviewConcept([abstract, direct], brief)).toBe(direct);
