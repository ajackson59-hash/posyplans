          import { extractNamedThemeSignals } from "../server/conceptQualityGate";

          function concept(
            conceptName: string,
            subjectFocus: string,
            illustrationPrompt: string,
            description = subjectFocus,
          ): InviteDesignConcept {
            return {
              conceptName,
              description,
              paletteColors: ["#0B3154", "#FF7A00", "#F7F1E7", "#6947A8"],
              fontPairingId: "editorial-serif",
              borderStyle: "none",
              layoutStyle: "centered",
              styleLaneId: "playful-illustrated",
              artDirection: {
