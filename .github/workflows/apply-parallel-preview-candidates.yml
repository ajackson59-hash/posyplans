name: Apply Parallel Preview Candidates

on:
  push:
    branches:
      - codex/launch-blockers
    paths:
      - .github/workflows/apply-parallel-preview-candidates.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
      VERCEL_ENV: local
      VERCEL_GIT_COMMIT_REF: ci-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/launch-blockers

      - name: Apply parallel best-of-two reliability
        run: python script/patch_parallel_preview_candidates.py

      - name: Verify exact repair
        run: |
          set -euo pipefail
          git diff --check
          npm ci
          npm run check
          npm test
          npm run vercel-build

      - name: Commit verified repair and retire patch runner
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-parallel-preview-candidates.yml script/patch_parallel_preview_candidates.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/prePaymentPreviewQuality.ts tests/prePaymentPreviewQuality.test.ts
          git diff --cached --check
          git commit -m 'Choose the best of two private teaser candidates'
          git push origin HEAD:codex/launch-blockers
