name: Retire Funded Preview Benchmark Runner

on:
  push:
    branches:
      - fix/prepayment-preview-quality-lock
    paths:
      - .github/workflows/retire-preview-benchmark-runner.yml

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prepayment-preview-quality-lock
          fetch-depth: 0

      - name: Remove spend-capable benchmark routes and temporary fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app = Path('server/app.ts')
          text = app.read_text()
          text = text.replace('import { registerPrePaymentPreviewBenchmarkRoutes } from "./prePaymentPreviewBenchmarkRoutes";\n', '')
          text = text.replace('      registerPrePaymentPreviewBenchmarkRoutes(app);\n', '')
          app.write_text(text)

          for candidate in [
              Path('server/prePaymentPreviewBenchmarkRoutes.ts'),
              Path('shared/prePaymentPreviewBenchmarkReferences.ts'),
              Path('server/prePaymentPreviewBenchmarkReferences.ts'),
          ]:
              if candidate.exists():
                  candidate.unlink()
          PY

          rm .github/workflows/retire-preview-benchmark-runner.yml

          if git grep -n "registerPrePaymentPreviewBenchmarkRoutes\|/api/qa/prepayment-preview-benchmark" -- ':!*.md'; then
            echo "Spend-capable benchmark route still referenced."
            exit 1
          fi

      - name: Verify cleaned branch
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm test -- --run

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retire the funded preview benchmark surface"
          git push origin HEAD:fix/prepayment-preview-quality-lock
