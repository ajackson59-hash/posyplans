name: Run High Input Fidelity Unicorn Academy Canary

on:
  push:
    branches:
      - fix/prepayment-preview-quality-lock
    paths:
      - .github/workflows/run-high-input-fidelity-unicorn-canary.yml

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_ORIGIN: https://posy-4hy9vz424-poseplans.vercel.app
      PREVIEW_SHARE_URL: https://posy-4hy9vz424-poseplans.vercel.app/?_vercel_share=PDfdgRWnoRscBubYLFM7WxVuFVdyUJ3w
      ENDPOINT: https://posy-4hy9vz424-poseplans.vercel.app/api/qa/prepayment-preview-benchmark/unicorn-academy-igloo/2
    steps:
      - name: Authenticate to exact protected Preview deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --location \
            --cookie-jar preview-cookies.txt \
            --cookie preview-cookies.txt \
            "$PREVIEW_SHARE_URL" \
            --output /dev/null

          status="$(curl --silent --show-error --location \
            --cookie preview-cookies.txt \
            --output report.json --write-out '%{http_code}' \
            --header 'Accept: application/json' \
            "$PREVIEW_ORIGIN/api/qa/prepayment-preview-benchmark/report")"
          test "$status" = "200"
          jq -e '.benchmarkVersion == "prepayment-quality-lock-2026-08-31-v3"' report.json >/dev/null
          jq -e '.gitSha == "e676bc6fd243b0604a3bb5f5a65ed93321c168fa"' report.json >/dev/null

      - name: Download official visual identity references
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            'https://cdn.prod.website-files.com/64b69cbacda0592c92130359/64b827c0b3cb21467d257047_character_single_01_sophia-unicorn.png' \
            --output sophia-wildstar.png
          curl --fail --silent --show-error --location \
            'https://cdn.prod.website-files.com/64b69cbacda0592c92130359/64b7f7f9c553df802bd8435f_character_single_02_layla-unicorn.png' \
            --output layla-glacier.png
          test "$(stat -c%s sophia-wildstar.png)" -le 2500000
          test "$(stat -c%s layla-glacier.png)" -le 2500000

      - name: Run private high-input-fidelity edit and strict review
        shell: bash
        run: |
          set -euo pipefail
          first="data:image/png;base64,$(base64 -w0 sophia-wildstar.png)"
          second="data:image/png;base64,$(base64 -w0 layla-glacier.png)"
          jq -n --arg first "$first" --arg second "$second" \
            '{inspirationImages: [$first, $second]}' > payload.json

          status="$(curl --silent --show-error --location --max-time 295 \
            --cookie preview-cookies.txt \
            --output canary.json --write-out '%{http_code}' \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --request POST --data-binary @payload.json "$ENDPOINT" || true)"
          echo "POST HTTP $status"

          complete="$(jq -r '.state == "complete"' canary.json 2>/dev/null || echo false)"
          if [ "$complete" != "true" ]; then
            for poll in $(seq 1 40); do
              sleep 8
              status="$(curl --silent --show-error --location \
                --cookie preview-cookies.txt \
                --output canary.json --write-out '%{http_code}' \
                --header 'Accept: application/json' \
                "$ENDPOINT" || true)"
              complete="$(jq -r '.state == "complete"' canary.json 2>/dev/null || echo false)"
              echo "Poll $poll/40: HTTP $status complete=$complete"
              [ "$complete" = "true" ] && break
            done
          fi

          jq . canary.json
          jq -e '.state == "complete" and .referencePixelsUsed == true' canary.json >/dev/null

          attempts="$(jq -r '.attempts // 0' canary.json)"
          if [[ "$attempts" =~ ^[0-9]+$ ]] && [ "$attempts" -gt 0 ]; then
            for candidate in $(seq 1 "$attempts"); do
              curl --silent --show-error --location --fail \
                --cookie preview-cookies.txt \
                "$ENDPOINT/asset/$candidate" \
                --output "unicorn-high-fidelity-candidate-$candidate.png" || true
            done
          fi

      - name: Preserve private evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unicorn-high-input-fidelity-canary
          path: |
            canary.json
            unicorn-high-fidelity-candidate-*.png
          if-no-files-found: warn
          retention-days: 2
