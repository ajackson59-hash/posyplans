name: Apply Preview Critic Feedback Repair

on:
  push:
    branches:
      - fix/launch-qa-find-my-event-label

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Trigger preview critic feedback repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/launch-qa-find-my-event-label
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Feed the critic's concrete findings into the retry prompt
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('server/illustrationGen.ts')
          source = path.read_text()
          source = source.replace(
            'interface ArtQualityScore {',
            'export interface ArtQualityScore {',
            1,
          )
          source = source.replace(
            'function tightenIllustrationPrompt(originalPrompt: string, score: ArtQualityScore): string {',
            'export function tightenIllustrationPrompt(originalPrompt: string, score: ArtQualityScore): string {',
            1,
          )
          old = '  return `${originalPrompt}. CRITICAL IMPROVEMENTS: ${fixes.join(". ")}`;'
          new = '''  const specificIssues = score.issues?.trim()
    ? `ART DIRECTOR'S SPECIFIC CORRECTIONS: ${score.issues.trim().slice(0, 800)}`
    : "";

  return `${originalPrompt}. CRITICAL IMPROVEMENTS: ${fixes.join(". ")}${specificIssues ? `. ${specificIssues}` : ""}`;'''
          if old not in source:
            raise SystemExit('tightening return line not found')
          path.write_text(source.replace(old, new, 1))

          test = Path('tests/illustrationQualityRepair.test.ts')
          test.write_text('''import { describe, expect, it } from "vitest";\nimport { tightenIllustrationPrompt, type ArtQualityScore } from "../server/illustrationGen";\n\ndescribe("illustration quality repair", () => {\n  it("feeds the art critic's concrete franchise and character findings into the retry", () => {\n    const score: ArtQualityScore = {\n      text_free: 2,\n      composition: 4,\n      premium_feel: 4,\n      theme_fit: 2,\n      overall: 3,\n      issues: "Generic unicorn riders; show Sophia and Wildstar with their recognizable Unicorn Academy visual cues, and remove the fake title text.",\n    };\n\n    const repaired = tightenIllustrationPrompt("Original image brief", score);\n\n    expect(repaired).toContain("ART DIRECTOR'S SPECIFIC CORRECTIONS");\n    expect(repaired).toContain("Sophia and Wildstar");\n    expect(repaired).toContain("remove the fake title text");\n    expect(repaired).toContain("absolutely no text");\n    expect(repaired).toContain("specifically requested concept");\n  });\n});\n''')

          Path('.github/workflows/apply-preview-critic-feedback.yml').unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused quality tests
        run: npx vitest run tests/illustrationQualityRepair.test.ts tests/prePaymentPreviewConcept.test.ts tests/prePaymentPreviewRoute.test.ts

      - name: Commit the repair
        run: |
          git config user.name "ajackson59-hash"
          git config user.email "ajackson59@gmail.com"
          git add -A
          git commit -m "Use art-critic specifics to repair off-brief previews"
          git push origin HEAD:fix/launch-qa-find-my-event-label
