name: Temporary Preview Artwork Inspection

on:
  push:
    branches:
      - fix/launch-qa-find-my-event-label

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch generated Preview artwork
        run: |
          curl --fail --silent --show-error \
            "https://zniggkeyyohniqrccblm.supabase.co/functions/v1/qa-preview-asset?token=posy-qa-4f7e2c81d3a9449ab5368f1db68bb0e6" \
            --output posy-brian-preview.png
          file posy-brian-preview.png
      - name: Upload artwork for private QA review
        uses: actions/upload-artifact@v4
        with:
          name: posy-brian-preview
          path: posy-brian-preview.png
          retention-days: 1
