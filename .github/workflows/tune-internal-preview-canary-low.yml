name: Test Low-Latency Internal Preview Canary

on:
  push:
    branches:
      - codex/launch-blockers
    paths:
      - .github/workflows/tune-internal-preview-canary-low.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/launch-blockers

      - name: Switch temporary canary to one low-quality candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/emailDiagnosticRoutes.ts')
          text = path.read_text()
          if text.count('quality: "medium",') != 1:
              raise SystemExit(f'expected one medium canary setting, found {text.count("quality: \\\"medium\\\",")}')
          text = text.replace('quality: "medium",', 'quality: "low",', 1)
          path.write_text(text)
          PY

      - name: Verify temporary canary build
        run: |
          npm ci
          npm run check
          npm test
          npm run vercel-build

      - name: Commit and retire workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/tune-internal-preview-canary-low.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/emailDiagnosticRoutes.ts
          git commit -m 'Time one low-quality preview candidate'
          git push origin HEAD:codex/launch-blockers
