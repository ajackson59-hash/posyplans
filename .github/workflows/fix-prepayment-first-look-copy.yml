name: Correct Prepayment First-Look Language

on:
  push:
    branches:
      - fix/launch-qa-find-my-event-label
    paths:
      - .github/workflows/fix-prepayment-first-look-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/launch-qa-find-my-event-label

      - name: Distinguish a safe first look from generated invitation artwork
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(path: str, old: str, new: str, count: int | None = None) -> None:
              file = Path(path)
              text = file.read_text()
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f"Expected text not found in {path}: {old}")
              if count is not None and found != count:
                  raise SystemExit(f"Expected {count} occurrences in {path}, found {found}: {old}")
              file.write_text(text.replace(old, new))

          replace_required(
              "client/src/pages/DraftGenerating.tsx",
              'let paywallCtaLabel = "Show me my personalized preview";',
              'let paywallCtaLabel = "Show me my personalized first look";',
              1,
          )
          replace_required(
              "client/src/pages/DraftGenerating.tsx",
              "Creating your personal preview…",
              "Creating your personalized first look…",
          )
          replace_required(
              "client/src/pages/DraftGenerating.tsx",
              "Revealing your personal preview…",
              "Revealing your personalized first look…",
          )
          replace_required(
              "client/src/pages/DraftGenerating.tsx",
              "Posy will create a personalized preview before checkout.",
              "Posy will create a personalized first look before checkout.",
              1,
          )
          replace_required(
              "client/src/pages/DraftGenerating.tsx",
              "Your preview is ready — view it above",
              "Your first look is ready — view it above",
              1,
          )

          guide = Path("client/src/components/PaywallPreviewGuide.tsx")
          guide_text = guide.read_text()
          old_busy = 'const busy = /Creating your personal preview|Revealing your personal preview/i.test(text);'
          new_busy = 'const busy = /Creating your (?:personal preview|personalized first look)|Revealing your (?:personal preview|personalized first look)/i.test(text);'
          if old_busy not in guide_text:
              raise SystemExit("Expected preview-busy matcher not found")
          guide_text = guide_text.replace(old_busy, new_busy, 1)
          old_placeholder = '/Add your email below|Posy will create a personalized preview/i.test('
          new_placeholder = '/Add your email below|Posy will create a personalized (?:preview|first look)/i.test('
          if old_placeholder not in guide_text:
              raise SystemExit("Expected placeholder matcher not found")
          guide.write_text(guide_text.replace(old_placeholder, new_placeholder, 1))

          test = Path("tests/draftGeneratingPaywall.test.tsx")
          test_text = test.read_text()
          expectations = {
              "Show me my personalized preview": "Show me my personalized first look",
              "Creating your personal preview": "Creating your personalized first look",
              "Revealing your personal preview": "Revealing your personalized first look",
          }
          for old, new in expectations.items():
              if old not in test_text:
                  raise SystemExit(f"Expected test assertion not found: {old}")
              test_text = test_text.replace(old, new)
          test.write_text(test_text)

          quality_test = Path("tests/prePaymentPreviewQuality.test.ts")
          quality_text = quality_test.read_text()
          stale = 'expect(generateImage.mock.calls[0][0].prompt).toContain("LIVE TYPOGRAPHY BOX");'
          current = 'expect(generateImage.mock.calls[0][0].prompt).toContain("visually quiet typography zone");'
          if stale not in quality_text:
              raise SystemExit("Expected stale typography-zone assertion not found")
          quality_test.write_text(quality_text.replace(stale, current, 1))
          PY

      - name: Verify copy correction
        shell: bash
        run: |
          npm ci
          npm run check
          npm test

      - name: Commit verified correction and retire this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-prepayment-first-look-copy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/DraftGenerating.tsx client/src/components/PaywallPreviewGuide.tsx tests/draftGeneratingPaywall.test.tsx tests/prePaymentPreviewQuality.test.ts
          git commit -m 'Clarify prepayment first-look language'
          git push origin HEAD:fix/launch-qa-find-my-event-label
