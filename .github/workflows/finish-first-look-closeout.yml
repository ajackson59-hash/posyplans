name: Finish First-Look Release Contract

on:
  push:
    branches:
      - codex/launch-blockers
    paths:
      - .github/workflows/finish-first-look-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/launch-blockers

      - name: Complete customer-visible first-look contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          def sub_once(path: str, pattern: str, replacement: str, flags: int = 0) -> None:
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"Expected exactly one regex match in {path}, found {count}: {pattern[:120]!r}")
              file.write_text(updated)

          # -----------------------------------------------------------------
          # Client: reviewed pixels stay untouched; generation shows an
          # immediate event-specific proof and never traps checkout.
          # -----------------------------------------------------------------
          page = "client/src/pages/DraftGenerating.tsx"
          replace_once(
              page,
              'type PrePaymentPreviewGenerationState = "idle" | "generating" | "ready" | "fallback";\n\ninterface PrePaymentPreviewReadiness {',
