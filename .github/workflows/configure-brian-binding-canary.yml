name: Configure Brian Binding Canary

on:
  push:
    branches:
      - codex/launch-blockers
    paths:
      - .github/workflows/configure-brian-binding-canary.yml

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
      VERCEL_ENV: local
      VERCEL_GIT_COMMIT_REF: ci-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/launch-blockers

      - name: Point the guarded build canary at the pristine binding event
        run: python script/configure_brian_binding_canary.py

      - name: Verify canary configuration without provider spend
        run: |
          set -euo pipefail
          git diff --check
          npm ci
          npm run check
          npm test
          npm run vercel-build

      - name: Commit verified canary configuration and retire setup runner
        run: |
          set -euo pipefail
          git rm .github/workflows/configure-brian-binding-canary.yml script/configure_brian_binding_canary.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/emailDiagnosticRoutes.ts script/run_preview_build_canary.ts
          git diff --cached --check
          git commit -m 'Run pristine Brian binding first-look canary'
          git push origin HEAD:codex/launch-blockers
