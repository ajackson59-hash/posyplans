name: Repair Prepayment First Look Composition V3

on:
  push:
    branches:
      - fix/launch-qa-find-my-event-label
    paths:
      - .github/workflows/fix-first-look-composition-v3.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/launch-qa-find-my-event-label

      - name: Repair the actual customer-visible composition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          quality_path = Path("server/prePaymentPreviewQuality.ts")
          quality = quality_path.read_text()

          old_function = '''function enrichBriefForNamedReference(brief: EventBrief, named: NamedCreativeReference | null): EventBrief {
            if (!named) return brief;
            return {
              ...brief,
              themeName: named.label,
              requirements: {
                required: unique([
                  ...brief.requirements.required,
                  ...named.requirements,
                ]),
                preferred: brief.requirements.preferred,
                excluded: unique([
                  ...brief.requirements.excluded,
                  `a generic adjacent aesthetic standing in for ${named.label}`,
                  "isolated accessories or palette-only shorthand standing in for the requested characters or world",
                ]),
              },
            };
          }'''
          new_function = '''function enrichBriefForNamedReference(brief: EventBrief, named: NamedCreativeReference | null): EventBrief {
            return {
              ...brief,
              themeName: named?.label ?? brief.themeName,
              requirements: {
                required: unique([
                  ...brief.requirements.required,
                  ...(named?.requirements ?? []),
                ]),
                preferred: brief.requirements.preferred,
                excluded: unique([
                  ...brief.requirements.excluded,
                  ...(named
                    ? [
                        `a generic adjacent aesthetic standing in for ${named.label}`,
                        "isolated accessories or palette-only shorthand standing in for the requested characters or world",
                      ]
                    : []),
                  "a visible blank card, white rectangle, paper panel, placard, sign, frame or placeholder box inside the artwork",
                  "a lead character's face or head cropped off by the canvas edge",
                ]),
              },
            };
          }'''
          if old_function not in quality:
              raise SystemExit("Named-reference enrichment function did not match expected source")
          quality = quality.replace(old_function, new_function, 1)

          old_layout = '"LAYOUT CONTRACT: the live opaque typography box occupies approximately left 21%, top 32%, width 58%, height 40%. Keep every required person, face, creature, signature object and defining interaction fully visible outside that box. Treat the box as protected negative space, not as an area that can cover a hero subject.",'
          new_layout = '"LAYOUT CONTRACT: reserve a naturally calm, low-detail typography zone at approximately left 21%, top 32%, width 58%, height 40%. Keep every required person, face, creature, signature object and defining interaction fully visible outside that zone. Do not draw a blank card, white rectangle, paper panel, placard, sign, frame or placeholder box—the quiet area must remain part of the continuous full-bleed scene.",'
          if quality.count(old_layout) != 1:
              raise SystemExit("Expected one preview layout contract")
          quality = quality.replace(old_layout, new_layout, 1)

          # The art-direction field is capped at 1,200 characters. Put the
          # customer-visible framing contract before long theme detail so it
          # cannot be truncated. Named requirements are still passed through
          # buildArtworkConstraints(brief), so removing this duplicate costs
          # no fidelity.
          explicit_line = '  const explicitRequirements = namedReference?.requirements ?? [];\n'
          duplicate_line = '    ...explicitRequirements.map((requirement) => `REQUIRED VISUAL FACT: ${requirement}.`),\n'
          if quality.count(explicit_line) != 1 or quality.count(duplicate_line) != 1:
              raise SystemExit("Expected duplicate named-requirement prompt lines")
          quality = quality.replace(explicit_line, "", 1).replace(duplicate_line, "", 1)
          layout_line = f'    {new_layout}\n'
          if quality.count(layout_line) != 1:
              raise SystemExit("Expected one revised layout-contract prompt line")
          quality = quality.replace(layout_line, "", 1)
          host_line = '    `ORIGINAL HOST BRIEF — authoritative: ${sourceBrief}`,\n'
          if quality.count(host_line) != 1:
              raise SystemExit("Expected one original-host-brief prompt line")
          quality = quality.replace(host_line, host_line + layout_line, 1)

          old_composition = 'composition: "portrait scene-led full-bleed composition arranged around a protected central typography box; all required subjects, faces and defining objects remain fully visible in the side and lower framing, with calm negative space reserved only for type",'
          new_composition = 'composition: "portrait scene-led full-bleed composition arranged around a naturally quiet central typography zone; all required subjects, faces and defining objects remain fully visible, with no visible panel, blank rectangle or cropped head",'
          if quality.count(old_composition) != 1:
              raise SystemExit("Expected one preview composition declaration")
          quality = quality.replace(old_composition, new_composition, 1)

          if quality.count('minOverlay: "plate",') != 1:
              raise SystemExit("Expected one preview plate overlay")
          quality = quality.replace('minOverlay: "plate",', 'minOverlay: "veil",', 1)
          quality_path.write_text(quality)

          page_path = Path("client/src/pages/DraftGenerating.tsx")
          page = page_path.read_text()
          if page.count("aspect-square") != 4:
              raise SystemExit(f"Expected four paywall square aspect classes, found {page.count('aspect-square')}")
          page_path.write_text(page.replace("aspect-square", "aspect-[9/16]"))

          test_path = Path("tests/prePaymentPreviewQuality.test.ts")
          test = test_path.read_text()
          old_import = '''  buildDirectionCard,
            detectNamedCreativeReference,'''
          new_import = '''  buildDirectionCard,
            buildQualityLockedPreviewBrief,
            detectNamedCreativeReference,'''
          if old_import not in test:
              raise SystemExit("Quality test import block did not match")
          test = test.replace(old_import, new_import, 1)

          marker = 'describe("prepayment preview quality lock", () => {'
          if marker not in test:
              raise SystemExit("Quality test describe marker not found")
          new_test = '''describe("prepayment preview quality lock", () => {
            it("keeps teaser artwork full-bleed instead of generating an unfinished blank panel", () => {
              const { brief, concept } = buildQualityLockedPreviewBrief(event);
              expect(concept.minOverlay).toBe("veil");
              expect(concept.art.composition).toContain("no visible panel");
              expect(concept.art.prompt).toContain("Do not draw a blank card");
              expect(brief.requirements.excluded).toContain(
                "a visible blank card, white rectangle, paper panel, placard, sign, frame or placeholder box inside the artwork",
              );
              expect(brief.requirements.excluded).toContain(
                "a lead character's face or head cropped off by the canvas edge",
              );
            });'''
          test_path.write_text(test.replace(marker, new_test, 1))

          paywall_test_path = Path("tests/draftGeneratingPaywall.test.tsx")
          paywall_test = paywall_test_path.read_text()
          target = 'const previewImage = await screen.findByTestId("img-prepayment-preview");'
          replacement = target + '\n    expect(previewImage.className).toContain("aspect-[9/16]");'
          if paywall_test.count(target) != 1:
              raise SystemExit("Expected one primary preview-image assertion target")
          paywall_test_path.write_text(paywall_test.replace(target, replacement, 1))
          PY

      - name: Verify composition repair
        shell: bash
        run: |
          npm ci
          npm run check
          npm test

      - name: Commit verified repair and retire workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-first-look-composition.yml .github/workflows/fix-first-look-composition-v2.yml .github/workflows/fix-first-look-composition-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/prePaymentPreviewQuality.ts client/src/pages/DraftGenerating.tsx tests/prePaymentPreviewQuality.test.ts tests/draftGeneratingPaywall.test.tsx
          git commit -m 'Repair first-look framing and remove blank panel'
          git push origin HEAD:fix/launch-qa-find-my-event-label
