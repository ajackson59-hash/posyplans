name: Apply Standalone Teaser Prompt

on:
  push:
    branches:
      - codex/launch-blockers
    paths:
      - .github/workflows/apply-standalone-teaser-prompt.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/launch-blockers

      - name: Apply patch
        run: python script/remove_teaser_layout_guards.py

      - name: Verify
        run: |
          npm ci
          npm run check
          npm test
          npm run vercel-build

      - name: Commit and clean up
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-standalone-teaser-prompt.yml script/remove_teaser_layout_guards.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/prePaymentPreviewQuality.ts tests/prePaymentPreviewQuality.test.ts
          git commit -m 'Use standalone artwork instructions for teaser generation'
          git push origin HEAD:codex/launch-blockers
