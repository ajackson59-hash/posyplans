name: Apply Native Fidelity Preview Repair

on:
  push:
    branches:
      - codex/launch-blockers
    paths:
      - .github/workflows/apply-native-fidelity-preview.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
      VERCEL_ENV: local
      VERCEL_GIT_COMMIT_REF: ci-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/launch-blockers

      - name: Apply native-fidelity preview repair
        run: python script/patch_named_preview_native_fidelity.py

      - name: Verify repair
        run: |
          set -euo pipefail
          git diff --check
          npm ci
          npm run check
          npm test
          npm run vercel-build

      - name: Commit verified repair and retire patch runner
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-native-fidelity-preview.yml script/patch_named_preview_native_fidelity.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/prePaymentPreviewQuality.ts tests/prePaymentPreviewQuality.test.ts tests/prePaymentPreviewReferenceQuality.test.ts
          git diff --cached --check
          git commit -m 'Use native high-fidelity path for named first looks'
          git push origin HEAD:codex/launch-blockers
