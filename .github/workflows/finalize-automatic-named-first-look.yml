name: Finalize Automatic Named Theme First Look

on:
  push:
    branches:
      - fix/launch-qa-find-my-event-label
    paths:
      - .github/workflows/finalize-automatic-named-first-look.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/launch-qa-find-my-event-label

      - name: Diversify private reference generation and finish first-look copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_required(path: str, old: str, new: str, count: int | None = None) -> None:
              file = Path(path)
              text = file.read_text()
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f"Expected text not found in {path}: {old}")
              if count is not None and found != count:
                  raise SystemExit(f"Expected {count} occurrences in {path}, found {found}: {old}")
              file.write_text(text.replace(old, new))

          resolver_path = Path("server/namedReferenceResolver.ts")
          resolver = resolver_path.read_text()
          resolver, match_count = re.subn(
              r'for \(const match of ((?:html|text)\.matchAll\([^\n]+\))\) \{',
              r'for (const match of Array.from(\1)) {',
              resolver,
          )
          if match_count != 4:
              raise SystemExit(f"Expected four matchAll loops, patched {match_count}")
          resolver_path.write_text(resolver)

          quality_path = Path("server/prePaymentPreviewQuality.ts")
          quality = quality_path.read_text()
          quality = quality.replace(
              "  type ArtworkGenerator,\n  type ArtworkQuality,",
              "  type ArtworkGenerator,\n  type ArtworkModel,\n  type ArtworkQuality,",
              1,
          )
          if "type ArtworkModel," not in quality:
              raise SystemExit("ArtworkModel import was not added")
          if quality.count("model: typeof DEFAULT_ARTWORK_MODEL;") != 2:
              raise SystemExit("Expected two preview-result model declarations")
          quality = quality.replace("model: typeof DEFAULT_ARTWORK_MODEL;", "model: ArtworkModel;")

          old = (
              '  const quality = dependencies.quality ?? (dependencies.referenceImages?.length ? "high" : "medium");\n'
              '  const model = dependencies.referenceImages?.length ? REFERENCE_ARTWORK_MODEL : DEFAULT_ARTWORK_MODEL;'
          )
          new = (
              '  const referenceLed = Boolean(dependencies.referenceImages?.length);\n'
              '  const quality = dependencies.quality ?? (referenceLed ? "high" : "medium");\n'
              '  const modelForCandidate = (candidate: number): ArtworkModel =>\n'
              '    referenceLed && candidate > 1 ? REFERENCE_ARTWORK_MODEL : DEFAULT_ARTWORK_MODEL;\n'
              '  let lastModel: ArtworkModel = modelForCandidate(1);'
          )
          if old not in quality:
              raise SystemExit("Reference model selection block not found")
          quality = quality.replace(old, new, 1)

          old = (
              '  for (let candidate = 1; candidate <= maxCandidates; candidate += 1) {\n'
              '    const prompt = candidate === 1'
          )
          new = (
              '  for (let candidate = 1; candidate <= maxCandidates; candidate += 1) {\n'
              '    const model = modelForCandidate(candidate);\n'
              '    lastModel = model;\n'
              '    const prompt = candidate === 1'
          )
          if old not in quality:
              raise SystemExit("Candidate loop block not found")
          quality = quality.replace(old, new, 1)

          old = '        inputFidelity: dependencies.referenceImages?.length ? "high" : undefined,'
          new = '        inputFidelity: referenceLed && model === REFERENCE_ARTWORK_MODEL ? "high" : undefined,'
          if old not in quality:
              raise SystemExit("Input fidelity line not found")
          quality = quality.replace(old, new, 1)

          old = (
              '  return {\n'
              '    kind: "rejected",\n'
              '    attempts: maxCandidates,\n'
              '    model,\n'
              '    reviews,\n'
              '  };'
          )
          new = (
              '  return {\n'
              '    kind: "rejected",\n'
              '    attempts: maxCandidates,\n'
              '    model: lastModel,\n'
              '    reviews,\n'
              '  };'
          )
          if old not in quality:
              raise SystemExit("Final rejected result block not found")
          quality_path.write_text(quality.replace(old, new, 1))

          page = "client/src/pages/DraftGenerating.tsx"
          replace_required(page, "Posy preview", "Posy first look", 1)
          replace_required(
              page,
              'alt="A low-resolution preview of your personalized invitation direction"',
              'alt="A personalized first look built from your event direction"',
              1,
          )
          PY

      - name: Verify automatic named-theme path
        shell: bash
        run: |
          npm ci
          npm run check
          npm test

      - name: Commit verified implementation and retire temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-automatic-named-first-look.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/namedReferenceResolver.ts server/prePaymentPreviewQuality.ts client/src/pages/DraftGenerating.tsx
          git commit -m 'Complete automatic named-theme first-look pipeline'
          git push origin HEAD:fix/launch-qa-find-my-event-label
