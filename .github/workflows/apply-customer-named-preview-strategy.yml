name: Apply Customer Named Preview Strategy

on:
  push:
    branches:
      - codex/launch-blockers
    paths:
      - .github/workflows/apply-customer-named-preview-strategy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
      VERCEL_ENV: local
      VERCEL_GIT_COMMIT_REF: ci-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/launch-blockers

      - name: Align customer named-preview generation
        run: python script/patch_customer_named_preview_strategy.py

      - name: Verify exact customer strategy
        run: |
          set -euo pipefail
          git diff --check
          npm ci
          npm run check
          npm test
          npm run vercel-build

      - name: Commit verified repair and retire patch runner
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-customer-named-preview-strategy.yml script/patch_customer_named_preview_strategy.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/prePaymentPreviewQualityRoutes.ts tests/prePaymentPreviewQualityRoutes.test.ts
          git diff --cached --check
          git commit -m 'Use text-first best-of-two for named first looks'
          git push origin HEAD:codex/launch-blockers
