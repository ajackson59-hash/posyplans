name: Apply Binding Preview Scene Requirements

on:
  push:
    branches:
      - codex/launch-blockers
    paths:
      - .github/workflows/apply-preview-explicit-requirements.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
      VERCEL_ENV: local
      VERCEL_GIT_COMMIT_REF: ci-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/launch-blockers

      # Retry with target-compatible regex iteration.
      - name: Bind explicit host scene details to the teaser quality gate
        run: python script/patch_preview_explicit_requirements.py

      - name: Verify exact binding contract
        run: |
          set -euo pipefail
          git diff --check
          npm ci
          npm run check
          npm test
          npm run vercel-build

      - name: Commit verified product repair and retire temporary runner
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-preview-explicit-requirements.yml script/patch_preview_explicit_requirements.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/prePaymentPreviewQuality.ts tests/prePaymentPreviewQuality.test.ts
          git diff --cached --check
          git commit -m 'Make explicit host scene details binding in first-look QA'
          git push origin HEAD:codex/launch-blockers
