name: Tune Internal Preview Canary

on:
  push:
    branches:
      - codex/launch-blockers
    paths:
      - .github/workflows/tune-internal-preview-canary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/launch-blockers

      - name: Switch canary to one medium GPT Image 2 candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/emailDiagnosticRoutes.ts')
          text = path.read_text()
          if text.count('quality: "high",') != 1:
              raise SystemExit(f'expected one canary high-quality setting, found {text.count(chr(113)+"uality: "+chr(34)+"high"+chr(34)+",")}')
          if text.count('maxCandidates: 2,') != 1:
              raise SystemExit(f'expected one canary two-candidate setting, found {text.count("maxCandidates: 2,")}')
          text = text.replace('quality: "high",', 'quality: "medium",', 1)
          text = text.replace('maxCandidates: 2,', 'maxCandidates: 1,', 1)
          path.write_text(text)
          PY

      - name: Verify tuned canary build
        run: |
          npm ci
          npm run check
          npm test
          npm run vercel-build

      - name: Commit tuned canary and retire workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/tune-internal-preview-canary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/emailDiagnosticRoutes.ts
          git commit -m 'Time one medium-quality preview candidate'
          git push origin HEAD:codex/launch-blockers
