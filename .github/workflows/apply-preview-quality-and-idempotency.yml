name: Apply Preview Quality and Idempotency

on:
  push:
    branches:
      - fix/prepayment-preview-quality-lock
    paths:
      - .github/workflows/apply-preview-quality-and-idempotency.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prepayment-preview-quality-lock
          fetch-depth: 0

      - name: Apply schema and quality strategy
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          schema = Path('shared/schema.ts')
          text = schema.read_text()
          old = '  (table) => [index("ai_first_artwork_attempts_event_id_idx").on(table.eventId)],\n);\n\nexport type AiFirstArtworkAttemptRow = typeof aiFirstArtworkAttempts.$inferSelect;'
          new = '''  (table) => [\n    uniqueIndex("ai_first_artwork_attempts_idempotency_key_uq")\n      .on(table.idempotencyKey)\n      .where(sql`${table.idempotencyKey} is not null`),\n    index("ai_first_artwork_attempts_event_id_idx").on(table.eventId),\n  ],\n);\n\nexport type AiFirstArtworkAttemptRow = typeof aiFirstArtworkAttempts.$inferSelect;'''
          if text.count(old) != 1:
            raise SystemExit(f'schema replacement count: {text.count(old)}')
          schema.write_text(text.replace(old, new))

          quality = Path('server/prePaymentPreviewQuality.ts')
          text = quality.read_text()
          replacements = [
            (
              '  type ArtworkGenerator,\n  type ArtworkReferenceImage,\n} from "./aiFirst/artwork";',
              '  type ArtworkGenerator,\n  type ArtworkQuality,\n  type ArtworkReferenceImage,\n} from "./aiFirst/artwork";'
            ),
            (
              '  referenceImages?: ArtworkReferenceImage[];\n  /** Two internal candidates maximum; neither is customer-visible before approval. */',
              '  referenceImages?: ArtworkReferenceImage[];\n  /** Reference-led named themes use high output quality; generic previews stay medium. */\n  quality?: ArtworkQuality;\n  /** Two internal candidates maximum; neither is customer-visible before approval. */'
            ),
            (
              '  const maxCandidates = dependencies.maxCandidates ?? 2;\n  const { brief, concept } = buildQualityLockedPreviewBrief(',
              '  const maxCandidates = dependencies.maxCandidates ?? 2;\n  const quality = dependencies.quality ?? (dependencies.referenceImages?.length ? "high" : "medium");\n  const { brief, concept } = buildQualityLockedPreviewBrief('
            ),
            (
              '        quality: "medium",\n        referenceImages: dependencies.referenceImages,',
              '        quality,\n        referenceImages: dependencies.referenceImages,'
            ),
          ]
          for old, new in replacements:
            if text.count(old) != 1:
              raise SystemExit(f'quality replacement count {text.count(old)} for {old[:60]!r}')
            text = text.replace(old, new)
          quality.write_text(text)

          benchmark = Path('server/prePaymentPreviewBenchmarkRoutes.ts')
          text = benchmark.read_text()
          replacements = [
            (
              '  type ArtworkResult,\n  type ArtworkSize,',
              '  type ArtworkResult,\n  type ArtworkQuality,\n  type ArtworkSize,'
            ),
            (
              'const BENCHMARK_VERSION = "prepayment-quality-lock-2026-08-31-v2";',
              'const BENCHMARK_VERSION = "prepayment-quality-lock-2026-08-31-v3";'
            ),
            (
              '  quality: "medium";\n  size: ArtworkSize;',
              '  quality: ArtworkQuality;\n  size: ArtworkSize;'
            ),
            (
              '      quality: "medium",\n      size: sizeForAspect(capture.request.aspectRatio),',
              '      quality: capture.request.quality ?? "medium",\n      size: sizeForAspect(capture.request.aspectRatio),'
            ),
          ]
          for old, new in replacements:
            if text.count(old) != 1:
              raise SystemExit(f'benchmark replacement count {text.count(old)} for {old[:60]!r}')
            text = text.replace(old, new)
          benchmark.write_text(text)
          PY

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ajackson59-hash"
          git config user.email "ajackson59@gmail.com"
          git rm .github/workflows/apply-preview-quality-and-idempotency.yml
          git add shared/schema.ts server/prePaymentPreviewQuality.ts server/prePaymentPreviewBenchmarkRoutes.ts
          git commit -m "Use high-fidelity quality for referenced previews"
          git push origin HEAD:fix/prepayment-preview-quality-lock
