name: Preserve general named theme detection

on:
  push:
    branches: [codex/launch-blockers]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: "postgres://test:test@127.0.0.1:5432/test"
      ANTHROPIC_API_KEY: "test"
      OPENAI_API_KEY: "test"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/launch-blockers

      - name: Apply narrow route correction
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("server/prePaymentPreviewQualityRoutes.ts")
          s = p.read_text()
          a = "  buildDirectionCard,\n  detectNamedCreativeReferenceSync,"
          b = "  buildDirectionCard,\n  detectNamedCreativeReference,\n  detectNamedCreativeReferenceSync,"
          if s.count(a) != 1:
              raise SystemExit("import target mismatch")
          s = s.replace(a, b, 1)
          a = """    // Launch-safe: only the curated, synchronous detector participates in a
    // customer request. The arbitrary LLM classifier remains available for a
    // future explicitly budgeted workflow, but is not reachable from this
    // route and therefore cannot add surprise latency or spend.
    const namedReference = namedReferenceForEventSync(event);"""
          b = """    // This explicit POST is the one customer action allowed to run the general
    // classifier. GET readiness/asset routes remain curated-only, synchronous,
    // zero-cost and network-free. The resolved identity is threaded into the
    // existing background job and persisted fallback instead of re-derived.
    const namedReference = await detectNamedCreativeReference(eventNamedReferenceBrief(event));"""
          if s.count(a) != 1:
              raise SystemExit("route target mismatch")
          p.write_text(s.replace(a, b, 1))
          PY

      - name: Verify
        run: |
          npm ci
          npm run check
          npm test
          npm run vercel-build

      - name: Commit and retire
        run: |
          git rm .github/workflows/preserve-general-theme-classifier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/prePaymentPreviewQualityRoutes.ts
          git commit -m "Keep one-shot general named-theme detection"
          git push origin HEAD:codex/launch-blockers
