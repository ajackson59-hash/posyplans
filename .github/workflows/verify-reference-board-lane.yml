name: Verify Named Theme Reference Board Lane

on:
  push:
    branches:
      - fix/prepayment-preview-quality-lock
    paths:
      - .github/workflows/verify-reference-board-lane.yml

permissions:
  contents: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prepayment-preview-quality-lock

      - name: Allow a pinned reference to be replaced
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/prePaymentPreviewQualityRoutes.ts')
          text = path.read_text()
          old = '''    if (namedReference) {
                if (currentKind === "reference-board") {
                  return res.json({
                    ready: true,
                    kind: "reference-board",
                    referenceRecommended: false,
                    referenceCaptured: true,
                  });
                }

                if (hasReference) {
                  await persistReferenceBoard(store, event, referenceImages, now());
                  return res.json({
                    ready: true,
                    kind: "reference-board",
                    referenceRecommended: false,
                    referenceCaptured: true,
                    namedReference: { id: namedReference.id, label: namedReference.label },
                  });
                }
'''
          new = '''    if (namedReference) {
                if (hasReference) {
                  await persistReferenceBoard(store, event, referenceImages, now());
                  return res.json({
                    ready: true,
                    kind: "reference-board",
                    referenceRecommended: false,
                    referenceCaptured: true,
                    namedReference: { id: namedReference.id, label: namedReference.label },
                  });
                }

                if (currentKind === "reference-board") {
                  return res.json({
                    ready: true,
                    kind: "reference-board",
                    referenceRecommended: false,
                    referenceCaptured: true,
                  });
                }
'''
          if old not in text:
              raise SystemExit('named-reference ordering block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install and verify
        shell: bash
        run: |
          npm ci
          npm run check
          npx vitest run \
            tests/prePaymentReferenceBoard.test.ts \
            tests/prePaymentPreviewQualityRoutes.test.ts \
            tests/paywallReferenceUpload.test.tsx \
            tests/prePaymentPreviewReferenceQuality.test.ts \
            tests/aiFirstArtworkReferenceInputs.test.ts \
            tests/draftGeneratingPaywall.test.tsx

      - name: Commit verified ordering and retire this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/verify-reference-board-lane.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/prePaymentPreviewQualityRoutes.ts
          git commit -m 'Finalize deterministic named-theme preview lane'
          git push origin HEAD:fix/prepayment-preview-quality-lock
