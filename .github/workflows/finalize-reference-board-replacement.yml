name: Finalize Reference Board Replacement

on:
  push:
    branches:
      - fix/prepayment-preview-quality-lock
    paths:
      - .github/workflows/finalize-reference-board-replacement.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prepayment-preview-quality-lock
      - name: Let a new upload replace the existing board
        run: |
          python -c "from pathlib import Path; p=Path('server/prePaymentPreviewQualityRoutes.ts'); s=p.read_text(); old='if (currentKind === \\\"reference-board\\\") {'; new='if (currentKind === \\\"reference-board\\\" && !hasReference) {'; assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Commit and remove temporary workflow
        run: |
          git rm .github/workflows/finalize-reference-board-replacement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/prePaymentPreviewQualityRoutes.ts
          git commit -m 'Allow named-theme reference boards to be replaced'
          git push origin HEAD:fix/prepayment-preview-quality-lock
