name: Finalize Durable Background First Look

on:
  push:
    branches:
      - fix/launch-qa-find-my-event-label
    paths:
      - .github/workflows/finalize-background-first-look.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/launch-qa-find-my-event-label

      - name: Install background-task support
        run: npm install @vercel/functions@3.9.5 --save

      - name: Fix server background-job narrowing
        run: node scripts/fix-background-route-narrowing.mjs

      - name: Apply client polling and recovery
        run: node scripts/finalize-background-first-look.mjs

      - name: Type-check application
        run: npm run check

      - name: Run regression suite
        run: npm test

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-background-first-look.yml
          git rm scripts/finalize-background-first-look.mjs
          git rm scripts/fix-background-route-narrowing.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json server/prePaymentPreviewQualityRoutes.ts client/src/pages/DraftGenerating.tsx client/src/components/PaywallPreviewGuide.tsx tests/draftGeneratingPaywall.test.tsx
          git commit -m 'Make named-theme first looks durable across navigation'
          git push origin HEAD:fix/launch-qa-find-my-event-label
