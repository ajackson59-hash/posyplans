name: Repair and Apply Preview Background Classification

on:
  push:
    branches:
      - codex/launch-blockers
    paths:
      - .github/workflows/repair-apply-preview-background-abort.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
      VERCEL_ENV: local
      VERCEL_GIT_COMMIT_REF: ci-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/launch-blockers

      - name: Repair drifted test transforms
        run: python script/repair_preview_background_patch.py

      - name: Apply background classification and real cancellation patch
        run: python script/patch_preview_background_abort.py

      - name: Verify exact application
        run: |
          set -euo pipefail
          git diff --check
          npm ci
          npm run check
          npm test
          npm run vercel-build

      - name: Commit verified implementation and remove temporary runners
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-preview-background-abort.yml
          git rm .github/workflows/repair-apply-preview-background-abort.yml
          git rm script/patch_preview_background_abort.py
          git rm script/repair_preview_background_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/prePaymentPreviewQuality.ts server/aiFirst/visionGate.ts server/prePaymentPreviewQualityRoutes.ts tests/prePaymentPreviewQualityRoutes.test.ts tests/prePaymentPreviewQuality.test.ts
          git diff --cached --check
          git commit -m 'Move first-look classification into bounded background work'
          git push origin HEAD:codex/launch-blockers
