name: Apply Authoritative Preview Deadline Cancellation

on:
  push:
    branches:
      - codex/launch-blockers
    paths:
      - .github/workflows/apply-preview-deadline-abort.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
      VERCEL_ENV: local
      VERCEL_GIT_COMMIT_REF: ci-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/launch-blockers

      - name: Apply authoritative cancellation deadline
        run: python script/patch_preview_deadline_abort.py

      - name: Verify implementation
        run: |
          set -euo pipefail
          git diff --check
          npm ci
          npm run check
          npm test
          npm run vercel-build

      - name: Commit verified implementation and retire runner
        run: |
          set -euo pipefail
          git rm -f .github/workflows/apply-preview-deadline-abort.yml
          git rm -f script/patch_preview_deadline_abort.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/prePaymentPreviewQualityRoutes.ts tests/prePaymentPreviewQualityRoutes.test.ts
          git diff --cached --check
          git commit -m 'Abort preview provider work at the authoritative deadline'
          git push origin HEAD:codex/launch-blockers
