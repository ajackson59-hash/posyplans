name: Review Exact Customer Preview Pixels

on:
  push:
    branches:
      - codex/launch-blockers
    paths:
      - .github/workflows/finish-first-look-quality.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/launch-blockers

      - name: Apply exact-pixel quality patch
        run: python script/patch_first_look_quality.py

      - name: Verify exact-pixel quality contract
        run: |
          npm ci
          npm run check
          npm test
          npm run vercel-build

      - name: Commit and retire patch runner
        run: |
          set -euo pipefail
          git rm .github/workflows/finish-first-look-quality.yml script/patch_first_look_quality.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/prePaymentPreviewQuality.ts tests/prePaymentPreviewQuality.test.ts tests/prePaymentPreviewReferenceQuality.test.ts
          git commit -m 'Review exact customer-visible preview pixels'
          git push origin HEAD:codex/launch-blockers
