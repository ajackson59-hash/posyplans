name: Version Repaired Preview Benchmark

on:
  push:
    branches:
      - fix/prepayment-preview-quality-lock
    paths:
      - .github/workflows/version-repair-benchmark.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prepayment-preview-quality-lock
          fetch-depth: 0

      - name: Give repaired runs a clean cache namespace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('server/prePaymentPreviewBenchmarkRoutes.ts')
          text = path.read_text()
          old = 'const BENCHMARK_VERSION = "prepayment-quality-lock-2026-08-31-v1";'
          new = 'const BENCHMARK_VERSION = "prepayment-quality-lock-2026-08-31-v2-repair";'
          if old not in text:
              raise SystemExit('Expected v1 benchmark constant was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit version and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/version-repair-benchmark.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/prePaymentPreviewBenchmarkRoutes.ts .github/workflows/version-repair-benchmark.yml
          git commit -m "Version the repaired preview benchmark"
          git push origin HEAD:fix/prepayment-preview-quality-lock
